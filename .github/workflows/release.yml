name: Release
'on':
  push:
    tags:
    - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, e.g. v0.1.0
        type: string
        required: true
      integration-run-id:
        description: Optional successful Integration run ID
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  publish:
    name: Publish runtime packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
    - name: Resolve tested runtimes for the version tag
      id: source
      uses: actions/github-script@v7
      env:
        RELEASE_TAG: ${{ inputs.tag }}
        INTEGRATION_RUN_ID: ${{ inputs.integration-run-id }}
      with:
        script: |
          const tag = process.env.RELEASE_TAG || context.ref.replace('refs/tags/', '');
          if (!/^v[0-9][0-9A-Za-z.+-]*$/.test(tag)) throw new Error('Use an existing v-prefixed version tag');
          const repository = (await github.rest.repos.get(context.repo)).data;
          let object = (await github.rest.git.getRef({...context.repo, ref:'tags/'+tag})).data.object;
          for (let depth=0; object.type === 'tag' && depth<10; depth++)
            object = (await github.rest.git.getTag({...context.repo, tag_sha:object.sha})).data.object;
          if (object.type !== 'commit') throw new Error('Tag does not resolve to a commit');
          const sha = object.sha;
          const eligible = run => run.head_sha === sha && run.conclusion === 'success' &&
            ['push','workflow_dispatch'].includes(run.event) && run.head_branch === repository.default_branch &&
            run.head_repository?.full_name === repository.full_name;
          let integration;
          if (process.env.INTEGRATION_RUN_ID) {
            const id = Number(process.env.INTEGRATION_RUN_ID);
            if (!Number.isSafeInteger(id) || id<=0) throw new Error('Invalid integration run ID');
            integration = (await github.rest.actions.getWorkflowRun({...context.repo, run_id:id})).data;
          } else {
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns,
              {...context.repo, workflow_id:'integration.yml', head_sha:sha, status:'success', per_page:100});
            integration = runs.find(eligible);
          }
          if (!integration || !eligible(integration) || integration.path.split('@')[0] !== '.github/workflows/integration.yml')
            throw new Error('Require a successful default-branch Integration run for this exact tagged commit');
          const tests = await github.paginate(github.rest.actions.listWorkflowRuns,
            {...context.repo, workflow_id:'test.yml', head_sha:sha, status:'success', per_page:100});
          if (!tests.some(eligible)) throw new Error('Rust unit tests have not passed for the tagged commit');
          const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
            {...context.repo, run_id:integration.id, per_page:100});
          for (const platform of ['linux','windows','macos']) {
            const pattern = new RegExp(`^${platform}-core-runtime-(x64|arm64)-${sha}$`);
            if (artifacts.filter(a => !a.expired && pattern.test(a.name)).length !== 1)
              throw new Error('Require exactly one tested runtime for '+platform);
          }
          core.setOutput('tag',tag); core.setOutput('sha',sha); core.setOutput('run-id',String(integration.id));
    - uses: actions/download-artifact@v4
      with:
        pattern: '*-core-runtime-*-${{ steps.source.outputs.sha }}'
        path: packages
        merge-multiple: true
        run-id: ${{ steps.source.outputs.run-id }}
        github-token: ${{ github.token }}
    - name: Verify release assets
      env:
        SOURCE_SHA: ${{ steps.source.outputs.sha }}
      run: |
        python - <<'PYCODE'
        import hashlib,json,os,tarfile,zipfile
        from pathlib import Path
        root=Path('packages')
        checksums=list(root.glob('*.sha256'))
        if len(checksums)!=3: raise RuntimeError('Expected three runtime archives')
        seen=set()
        for checksum in checksums:
            expected,name=checksum.read_text().strip().split(None,1)
            archive=root/name.strip()
            if archive.parent.resolve()!=root.resolve(): raise RuntimeError('Invalid asset path')
            with archive.open('rb') as stream:
                if hashlib.file_digest(stream,'sha256').hexdigest()!=expected: raise RuntimeError('Archive checksum mismatch')
            if archive.suffix=='.zip':
                with zipfile.ZipFile(archive) as bundle: manifest=json.loads(bundle.read('runtime/manifest.json'))
            else:
                with tarfile.open(archive) as bundle: manifest=json.load(bundle.extractfile('runtime/manifest.json'))
            platform={'win32':'windows','darwin':'macos','linux':'linux'}.get(manifest['platform'])
            arch={'x86_64':'x64','aarch64':'arm64'}.get(manifest['arch'])
            if manifest['source_sha']!=os.environ['SOURCE_SHA'] or manifest['kind']!='runtime' or platform in seen or arch is None:
                raise RuntimeError('Runtime package identity mismatch')
            stem=f"{platform}-core-runtime-{arch}-{manifest['source_sha']}"
            extension='.zip' if platform=='windows' else '.tar.gz'
            if archive.name!=stem+extension: raise RuntimeError('Runtime asset name mismatch')
            seen.add(platform)
        if seen!={'linux','windows','macos'}: raise RuntimeError('Missing platform')
        if len(list(root.iterdir()))!=6: raise RuntimeError('Unexpected release assets')
        PYCODE
    - name: Publish verified runtime archives and checksums
      uses: actions/github-script@v7
      env:
        RELEASE_TAG: ${{ steps.source.outputs.tag }}
      with:
        script: |
          const fs = require('fs');
          const tag = process.env.RELEASE_TAG;
          let release;
          try { release = (await github.rest.repos.getReleaseByTag({...context.repo,tag})).data; }
          catch (error) { if (error.status !== 404) throw error; }
          if (release && !release.draft) throw new Error('Published release already exists; do not overwrite tested assets');
          if (!release) release = (await github.rest.repos.createRelease({...context.repo,tag_name:tag,
            name:tag,draft:true,generate_release_notes:true})).data;
          const existing = await github.paginate(github.rest.repos.listReleaseAssets,
            {...context.repo,release_id:release.id,per_page:100});
          for (const name of fs.readdirSync('packages').sort()) {
            const old = existing.find(asset => asset.name===name);
            if (old) await github.rest.repos.deleteReleaseAsset({...context.repo,asset_id:old.id});
            const data = fs.readFileSync('packages/'+name);
            await github.rest.repos.uploadReleaseAsset({...context.repo,release_id:release.id,name,data,
              headers:{'content-type':'application/octet-stream','content-length':data.length}});
          }
          await github.rest.repos.updateRelease({...context.repo,release_id:release.id,draft:false});
          core.notice('Published validated runtimes for '+tag);
