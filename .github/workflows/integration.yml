name: Integration
'on':
  push:
    branches:
    - '**'
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  linux:
    name: linux
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
    - name: Install Linux build dependencies
      run: |
        apt-get update
        apt-get install -y git ca-certificates curl build-essential pkg-config python3 python-is-python3 meson ninja-build patchelf openssh-client openssh-server x11-utils \
          libx11-dev libxkbcommon-dev libwayland-dev libpixman-1-dev libxkbfile-dev libxfont-dev libmd-dev xtrans-dev \
          x11proto-dev xkb-data x11-xkb-utils libxcursor1 libx11-xcb1 libxi6 libxkbcommon-x11-0 \
          libgl-dev libglx-dev libogre-1.12-dev fonts-dejavu-core xvfb xauth libvulkan1 mesa-vulkan-drivers libgl1-mesa-dri libglx-mesa0
    - uses: actions/checkout@v7.0.1
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2.9.3
      with:
        cache-on-failure: true
    - name: Build Unix XLibre core
      run: bash scripts/build-xlibre.sh
    - name: Build release client
      run: cargo build --locked --release
    - name: Assemble Unix runtime
      id: bundle
      run: |
        python scripts/bundle-core.py --core "$(cat build/xlibre/wayx-core-path.txt)" --client target/release/wayx \
          --compiler "$(command -v xkbcomp)" --xkb-dir "$(pkg-config --variable=xkbconfigdir xkbcomp)" \
          --license-dir build/xlibre-source --license-dir build/native-sources \
          --license-dir /usr/share/doc \
          --output build/runtime
    - name: Build local integration fixtures
      id: test-kit
      run: python scripts/build-test-kit.py --runtime build/runtime --output build/test-kit --integration-only
    - name: External OpenSSH forwarding
      run: python scripts/test-openssh.py --binary target/release/wayx --core "$(cat build/xlibre/wayx-core-path.txt)"
    - name: Check Windows Screen hook syntax
      run: python scripts/test-ddx-window-hooks.py
    - name: Verify and relocate runtime into a path with spaces
      shell: bash
      run: |
        python scripts/relocate-runtime.py --runtime build/runtime --output 'build/relocated runtime' --expected-sha "${{ github.sha }}"
    - name: Test bundled runtime
      shell: bash
      env:
        EXPECTED_SHA: ${{ github.sha }}
      run: |
        python scripts/test-package.py --runtime 'build/relocated runtime' --test-kit build/test-kit --expected-sha "$EXPECTED_SHA" --logs test-output
    - name: Upload tested runtime package
      uses: actions/upload-artifact@v7.0.2
      with:
        name: ${{ steps.bundle.outputs.artifact_name }}
        path: build/relocated runtime/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
        overwrite: true
        compression-level: 6
    - name: Upload integration diagnostics
      if: always()
      uses: actions/upload-artifact@v7.0.2
      with:
        name: linux-result-${{ github.run_id }}-${{ github.run_attempt }}
        path: test-output
        if-no-files-found: warn
        retention-days: 7
  windows:
    name: windows
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/build/vcpkg-binary-cache
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2.9.3
      with:
        cache-on-failure: true
    - uses: actions/setup-python@v7.1.0
      with:
        python-version: '3.12'
    - uses: actions/checkout@v7.0.1
      with:
        repository: microsoft/vcpkg
        ref: a2f9862da6d88040a8537fb9b8cb24deaa9a196b
        path: build/vcpkg
    - uses: ilammy/msvc-dev-cmd@v1.13.0
    - uses: actions/cache/restore@v6.1.0
      id: native-dependency-cache
      with:
        path: build/vcpkg-binary-cache
        key: native-windows-a2f9862-${{ hashFiles('scripts/windows/vcpkg.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          native-windows-a2f9862-${{ hashFiles('scripts/windows/vcpkg.json') }}-
    - name: Build pinned Windows X11 C dependencies
      timeout-minutes: 35
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
        build/vcpkg/bootstrap-vcpkg.bat -disableMetrics
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        build/vcpkg/vcpkg.exe install --triplet x64-windows --x-manifest-root=scripts/windows --x-install-root=build/windows-installed
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - uses: actions/cache/save@v6.1.0
      continue-on-error: true
      if: always() && !cancelled()
      with:
        path: build/vcpkg-binary-cache
        key: ${{ steps.native-dependency-cache.outputs.cache-primary-key }}
    - uses: msys2/setup-msys2@v2.33.0
      id: msys2
      with:
        msystem: UCRT64
        update: true
        install: git mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-meson mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-python
          bison perl mingw-w64-ucrt-x86_64-libxslt
    - name: Build XKB tools, data and core DLL
      shell: msys2 {0}
      run: |
        export WAYX_WINDOWS_DEPS="$GITHUB_WORKSPACE/build/windows-installed/x64-windows"
        bash scripts/build-windows-core.sh
    - name: Build release client
      run: cargo build --locked --release
    - name: Assemble Windows runtime
      id: bundle
      shell: pwsh
      env:
        WAYX_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
      run: |
        $env:PATH = "$env:WAYX_MSYS2_ROOT/ucrt64/bin;" + $env:PATH
        $core = (Get-Content build/xlibre/wayx-core-path.txt).Trim()
        python scripts/bundle-core.py --core $core --client target/release/wayx.exe --compiler build/windows-native/bin/xkbcomp.exe --xkb-dir build/windows-native/share/xkeyboard-config-2 --search-dir build/windows-installed/x64-windows/bin --search-dir "$env:WAYX_MSYS2_ROOT/ucrt64/bin" --license-dir build/xlibre-source --license-dir build/windows-installed/x64-windows/share --license-dir build/native-sources --output build/runtime
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Build local integration fixtures
      id: test-kit
      run: python scripts/build-test-kit.py --runtime build/runtime --output build/test-kit --integration-only
    - name: Verify and relocate runtime into a path with spaces
      shell: bash
      run: |
        python scripts/relocate-runtime.py --runtime build/runtime --output 'build/relocated runtime' --expected-sha "${{ github.sha }}"
    - name: Hide Windows core build dependencies
      shell: pwsh
      run: |
        Move-Item build/windows-installed build/windows-installed-disabled
        Move-Item build/windows-native build/windows-native-disabled
    - name: Test bundled runtime
      shell: bash
      env:
        EXPECTED_SHA: ${{ github.sha }}
      run: |
        python scripts/test-package.py --runtime 'build/relocated runtime' --test-kit build/test-kit --expected-sha "$EXPECTED_SHA" --logs test-output
    - name: Upload tested runtime package
      uses: actions/upload-artifact@v7.0.2
      with:
        name: ${{ steps.bundle.outputs.artifact_name }}
        path: build/relocated runtime/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
        overwrite: true
        compression-level: 6
    - name: Upload integration diagnostics
      if: always()
      uses: actions/upload-artifact@v7.0.2
      with:
        name: windows-result-${{ github.run_id }}-${{ github.run_attempt }}
        path: test-output
        if-no-files-found: warn
        retention-days: 7
  macos:
    name: macos
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2.9.3
      with:
        cache-on-failure: true
    - uses: actions/setup-python@v7.1.0
      with:
        python-version: '3.12'
    - name: Install macOS build dependencies
      run: brew install meson ninja pkgconf pixman libxfont2 libxkbfile xorgproto xtrans xkbcomp xkeyboard-config
    - name: Build Unix XLibre core
      run: bash scripts/build-xlibre.sh
    - name: Build release client
      run: cargo build --locked --release
    - name: Assemble Unix runtime
      id: bundle
      run: |
        python scripts/bundle-core.py --core "$(cat build/xlibre/wayx-core-path.txt)" --client target/release/wayx \
          --compiler "$(command -v xkbcomp)" --xkb-dir "$(pkg-config --variable=xkbconfigdir xkbcomp)" \
          --license-dir build/xlibre-source --license-dir build/native-sources \
          --output build/runtime
    - name: Build local integration fixtures
      id: test-kit
      run: python scripts/build-test-kit.py --runtime build/runtime --output build/test-kit --integration-only
    - name: Verify and relocate runtime into a path with spaces
      shell: bash
      run: |
        python scripts/relocate-runtime.py --runtime build/runtime --output 'build/relocated runtime' --expected-sha "${{ github.sha }}"
    - name: Test bundled runtime
      shell: bash
      env:
        EXPECTED_SHA: ${{ github.sha }}
      run: |
        python scripts/test-package.py --runtime 'build/relocated runtime' --test-kit build/test-kit --expected-sha "$EXPECTED_SHA" --logs test-output
    - name: Upload tested runtime package
      uses: actions/upload-artifact@v7.0.2
      with:
        name: ${{ steps.bundle.outputs.artifact_name }}
        path: build/relocated runtime/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
        overwrite: true
        compression-level: 6
    - name: Upload integration diagnostics
      if: always()
      uses: actions/upload-artifact@v7.0.2
      with:
        name: macos-result-${{ github.run_id }}-${{ github.run_attempt }}
        path: test-output
        if-no-files-found: warn
        retention-days: 7
