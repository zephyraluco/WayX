name: Build complete package
'on':
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
    outputs:
      runtime-artifact:
        value: ${{ jobs.build.outputs.runtime-artifact }}
      test-artifact:
        value: ${{ jobs.build.outputs.test-artifact }}
permissions:
  contents: read
jobs:
  build:
    name: Build ${{ inputs.platform }} runtime
    runs-on: ${{ inputs.platform == 'windows' && 'windows-2022' || inputs.platform == 'macos' && 'macos-latest' || 'ubuntu-latest' }}
    container: ${{ inputs.platform == 'linux' && 'debian:trixie' || '' }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/build/vcpkg-binary-cache
    outputs:
      runtime-artifact: ${{ steps.unix-runtime.outputs.artifact_name || steps.windows-runtime.outputs.artifact_name }}
      test-artifact: ${{ steps.test-kit.outputs.artifact_name }}
    steps:
    - name: Install Linux build dependencies
      if: inputs.platform == 'linux'
      run: |
        apt-get update
        apt-get install -y git ca-certificates curl build-essential pkg-config python3 python-is-python3 meson ninja-build patchelf \
          libx11-dev libxkbcommon-dev libwayland-dev libpixman-1-dev libxkbfile-dev libxfont-dev libmd-dev xtrans-dev \
          x11proto-dev xkb-data x11-xkb-utils libxcursor1 libx11-xcb1 libxi6 libxkbcommon-x11-0 \
          libgl-dev libglx-dev libogre-1.12-dev
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
    - uses: actions/setup-python@v5
      if: inputs.platform != 'linux'
      with:
        python-version: '3.12'
    - name: Install macOS build dependencies
      if: inputs.platform == 'macos'
      run: brew install meson ninja pkgconf pixman libxfont2 libxkbfile xorgproto xtrans xkbcomp xkeyboard-config
    - uses: actions/checkout@v4
      with:
        repository: microsoft/vcpkg
        ref: a2f9862da6d88040a8537fb9b8cb24deaa9a196b
        path: build/vcpkg
      if: inputs.platform == 'windows'
    - uses: ilammy/msvc-dev-cmd@v1
      if: inputs.platform == 'windows'
    - uses: actions/cache/restore@v4
      id: native-dependency-cache
      with:
        path: build/vcpkg-binary-cache
        key: native-windows-a2f9862-${{ hashFiles('scripts/windows/vcpkg.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          native-windows-a2f9862-${{ hashFiles('scripts/windows/vcpkg.json') }}-
      if: inputs.platform == 'windows'
    - name: Build pinned Windows X11 C dependencies
      timeout-minutes: 35
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
        build/vcpkg/bootstrap-vcpkg.bat -disableMetrics
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        build/vcpkg/vcpkg.exe install --triplet x64-windows --x-manifest-root=scripts/windows --x-install-root=build/windows-installed
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      if: inputs.platform == 'windows'
    - uses: actions/cache/save@v4
      continue-on-error: true
      if: inputs.platform == 'windows' && always() && !cancelled()
      with:
        path: build/vcpkg-binary-cache
        key: ${{ steps.native-dependency-cache.outputs.cache-primary-key }}
    - uses: msys2/setup-msys2@v2
      id: msys2
      with:
        msystem: UCRT64
        update: true
        install: git mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-meson mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-python
          bison perl mingw-w64-ucrt-x86_64-libxslt
      if: inputs.platform == 'windows'
    - name: Build XKB tools, data and core DLL
      shell: msys2 {0}
      run: |
        export WAYX_WINDOWS_DEPS="$GITHUB_WORKSPACE/build/windows-installed/x64-windows"
        bash scripts/build-windows-core.sh
      if: inputs.platform == 'windows'
    - name: Build Unix XLibre core
      if: inputs.platform != 'windows'
      run: bash scripts/build-xlibre.sh
    - name: Build release client
      run: cargo build --locked --release
    - name: Assemble Unix runtime
      id: unix-runtime
      if: inputs.platform != 'windows'
      run: |
        python scripts/bundle-core.py --core "$(cat build/xlibre/wayx-core-path.txt)" --client target/release/wayx \
          --compiler "$(command -v xkbcomp)" --xkb-dir "$(pkg-config --variable=xkbconfigdir xkbcomp)" \
          --license-dir build/xlibre-source --license-dir build/native-sources \
          ${{ inputs.platform == 'linux' && '--license-dir /usr/share/doc' || '' }} \
          --output build/runtime --archive-dir build/runtime-archives
    - name: Assemble Windows runtime
      id: windows-runtime
      if: inputs.platform == 'windows'
      shell: pwsh
      env:
        WAYX_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
      run: |
        $env:PATH = "$env:WAYX_MSYS2_ROOT/ucrt64/bin;" + $env:PATH
        $core = (Get-Content build/xlibre/wayx-core-path.txt).Trim()
        python scripts/bundle-core.py --core $core --client target/release/wayx.exe --compiler build/windows-native/bin/xkbcomp.exe --xkb-dir build/windows-native/share/xkeyboard-config-2 --search-dir build/windows-installed/x64-windows/bin --search-dir "$env:WAYX_MSYS2_ROOT/ucrt64/bin" --license-dir build/xlibre-source --license-dir build/windows-installed/x64-windows/share --license-dir build/native-sources --output build/runtime --archive-dir build/runtime-archives
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - uses: actions/upload-artifact@v4
      id: runtime
      with:
        name: ${{ steps.unix-runtime.outputs.artifact_name || steps.windows-runtime.outputs.artifact_name }}
        path: build/runtime-archives/*
        if-no-files-found: error
        retention-days: 7
        overwrite: true
        compression-level: 0
    - name: Compile and archive test attachment
      id: test-kit
      run: python scripts/build-test-kit.py --runtime build/runtime --output build/test-kit --archive-dir build/test-archives
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.test-kit.outputs.artifact_name }}
        path: build/test-archives/*
        if-no-files-found: error
        retention-days: 7
        overwrite: true
        compression-level: 0
    - name: Check source formatting and types
      run: |
        cargo fmt --check
        cargo clippy --locked --release --all-targets --all-features -- -D warnings
    - name: Check Windows Screen hook syntax
      if: inputs.platform == 'linux'
      run: python scripts/test-ddx-window-hooks.py
