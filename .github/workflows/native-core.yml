name: Native XLibre core
on: [push, pull_request]
permissions:
  contents: read
jobs:
  macos-core:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install native core dependencies
        run: brew install meson ninja pkgconf pixman libxfont2 libxkbfile xorgproto xtrans xkbcomp xkeyboard-config
      - name: Build XLibre DDX
        run: bash scripts/build-xlibre.sh
      - name: Exercise real X11 rendering, input, clipboard and window management
        run: |
          export WAYX_TEST_CORE="$(cat build/xlibre/wayx-core-path.txt)"
          cargo test --locked --test xlibre --test rootless --test window_manager -- --ignored --nocapture
      - name: Exercise native AppKit window and Metal presentation
        run: |
          cargo build --locked
          target/debug/wayx serve --core "$(cat build/xlibre/wayx-core-path.txt)" --frames 3 -- :196 -screen 0 640x480x24 -crtcs 1@640x480 -nolisten tcp -ac
      - uses: actions/upload-artifact@v4
        with:
          name: macos-core
          path: build/xlibre/hw/wayx/*.dylib
  windows-core:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: a2f9862da6d88040a8537fb9b8cb24deaa9a196b
          path: build/vcpkg
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build pinned Windows X11 C dependencies
        shell: pwsh
        run: |
          build/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          build/vcpkg/vcpkg.exe install --triplet x64-windows --x-manifest-root=scripts/windows --x-install-root=build/windows-installed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python
            bison
            mingw-w64-ucrt-x86_64-libxslt
      - name: Build XKB tools, data and core DLL
        shell: msys2 {0}
        run: |
          export WAYX_WINDOWS_DEPS="$GITHUB_WORKSPACE/build/windows-installed/x64-windows"
          bash scripts/build-windows-core.sh
      - name: Exercise protocol and actual Win32 presentation
        shell: pwsh
        run: |
          $env:PATH = "$pwd/build/windows-native/bin;$pwd/build/windows-installed/x64-windows/bin;C:/msys64/ucrt64/bin;" + $env:PATH
          $env:WAYX_TEST_CORE = (Get-Content build/xlibre/wayx-core-path.txt).Trim()
          cargo test --locked --test xlibre --test rootless --test window_manager -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          target/debug/wayx.exe serve --core $env:WAYX_TEST_CORE --frames 3 -- :196 -screen 0 640x480x24 -crtcs 1@640x480 -listen tcp -ac
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-core
          path: build/xlibre/hw/wayx/*.dll
