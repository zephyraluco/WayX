name: Native XLibre core
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  macos-core:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install native core dependencies
        run: brew install meson ninja pkgconf pixman libxfont2 libxkbfile xorgproto xtrans xkbcomp xkeyboard-config
      - name: Build XLibre DDX
        run: bash scripts/build-xlibre.sh
      - name: Exercise real X11 rendering, input, clipboard and window management
        run: |
          export WAYX_TEST_CORE="$(cat build/xlibre/wayx-core-path.txt)"
          cargo test --locked --test xlibre --test rootless --test window_manager --test desktop_layout -- --ignored --nocapture
          WAYX_TEST_MONITORS=1 cargo test --locked --test xlibre -- --ignored --nocapture
      - name: Verify real Xlib XIM interoperability
        run: |
          export XLOCALEDIR="$(brew --prefix libx11)/share/X11/locale"
          test -f "$XLOCALEDIR/locale.alias"
          test -f "$XLOCALEDIR/en_US.UTF-8/XLC_LOCALE"
          # Homebrew 1.8.13 installs Darwin locale modules as *.2.so,
          # while Xlib's dynamic locale loader asks for *.so.2.
          # Stage aliases privately; leave the installed library untouched.
          modules="$(brew --prefix libx11)/lib/X11/locale"
          if [ -d "$modules" ]; then
            export XLOCALELIBDIR="$RUNNER_TEMP/wayx-xlib-locales"
            cp -R "$modules" "$XLOCALELIBDIR"
            for module in "$XLOCALELIBDIR"/common/*.2.so; do
              [ -f "$module" ] || continue
              ln -s "$(basename "$module")" "${module%.2.so}.so.2"
            done
          fi
          pkg-config --modversion x11
          cc -std=c11 -Wall -Wextra -Werror $(pkg-config --cflags x11) tests/xim-client.c $(pkg-config --libs x11) -o /tmp/wayx-xim-client
          otool -L /tmp/wayx-xim-client
          /tmp/wayx-xim-client --probe-locale
          WAYX_TEST_CORE="$(cat build/xlibre/wayx-core-path.txt)" WAYX_TEST_XIM_CLIENT=/tmp/wayx-xim-client cargo test --locked --test ime -- --ignored --nocapture
      - name: Exercise native AppKit window and Metal presentation
        run: |
          cargo build --locked --release
          target/release/wayx serve --core "$(cat build/xlibre/wayx-core-path.txt)" --frames 3 -- :196 -screen 0 640x480x24 -crtcs 1@640x480 -nolisten tcp -ac
      - name: Stage and exercise relocated core runtime
        run: |
          python3 scripts/bundle-core.py --core "$(cat build/xlibre/wayx-core-path.txt)" --client target/release/wayx --compiler "$(command -v xkbcomp)" --xkb-dir "$(pkg-config --variable=xkbconfigdir xkbcomp)" --license-dir build/xlibre-source --license-dir build/native-sources --output build/core-runtime
          mv build/core-runtime build/relocated-runtime
          build/relocated-runtime/wayx.sh --frames 3 -- :196 -screen 0 640x480x24 -crtcs 1@640x480 -nolisten tcp -ac
      - name: Archive runtime preserving executable permissions
        run: tar -czf build/macos-core-runtime.tar.gz -C build relocated-runtime
      - uses: actions/upload-artifact@v4
        with:
          name: macos-core-runtime-${{ github.sha }}
          path: build/macos-core-runtime.tar.gz
          if-no-files-found: error
          retention-days: 7
  windows-core:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/build/vcpkg-binary-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: a2f9862da6d88040a8537fb9b8cb24deaa9a196b
          path: build/vcpkg
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/cache/restore@v4
        id: native-dependency-cache
        with:
          path: build/vcpkg-binary-cache
          key: native-windows-a2f9862-${{ hashFiles('scripts/windows/vcpkg.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            native-windows-a2f9862-${{ hashFiles('scripts/windows/vcpkg.json') }}-
      - name: Build pinned Windows X11 C dependencies
        timeout-minutes: 35
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          build/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          build/vcpkg/vcpkg.exe install --triplet x64-windows --x-manifest-root=scripts/windows --x-install-root=build/windows-installed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/cache/save@v4
        continue-on-error: true
        if: always() && !cancelled()
        with:
          path: build/vcpkg-binary-cache
          key: ${{ steps.native-dependency-cache.outputs.cache-primary-key }}
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python
            bison
            perl
            mingw-w64-ucrt-x86_64-libxslt
      - name: Build XKB tools, data and core DLL
        shell: msys2 {0}
        run: |
          export WAYX_WINDOWS_DEPS="$GITHUB_WORKSPACE/build/windows-installed/x64-windows"
          bash scripts/build-windows-core.sh
      - name: Build protocol test binaries
        timeout-minutes: 10
        shell: pwsh
        run: |
          cargo test --locked --test xlibre --test rootless --test window_manager --test desktop_layout --no-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise real Windows X11 protocol
        timeout-minutes: 3
        env:
          WAYX_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        shell: pwsh
        run: |
          $env:PATH = "$pwd/build/windows-native/bin;$pwd/build/windows-installed/x64-windows/bin;$env:WAYX_MSYS2_ROOT/ucrt64/bin;" + $env:PATH
          $env:WAYX_TEST_CORE = (Get-Content build/xlibre/wayx-core-path.txt).Trim()
          cargo test --locked --test xlibre --test rootless --test window_manager --test desktop_layout -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:WAYX_TEST_MONITORS = "1"
          cargo test --locked --test xlibre -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:WAYX_TEST_MONITORS
      - name: Build release client
        timeout-minutes: 15
        shell: pwsh
        run: |
          cargo build --locked --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise actual Win32 presentation
        timeout-minutes: 3
        env:
          WAYX_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        shell: pwsh
        run: |
          $env:PATH = "$pwd/build/windows-native/bin;$pwd/build/windows-installed/x64-windows/bin;$env:WAYX_MSYS2_ROOT/ucrt64/bin;" + $env:PATH
          $core = (Get-Content build/xlibre/wayx-core-path.txt).Trim()
          target/release/wayx.exe serve --core $core --frames 3 -- :196 -screen 0 640x480x24 -crtcs 1@640x480 -listen tcp -ac
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check authenticated rootless idle CPU, geometry and GPU lifetime
        timeout-minutes: 5
        env:
          WAYX_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        shell: pwsh
        run: |
          $env:PATH = "$pwd/build/windows-native/bin;$pwd/build/windows-installed/x64-windows/bin;$env:WAYX_MSYS2_ROOT/ucrt64/bin;" + $env:PATH
          $core = (Get-Content build/xlibre/wayx-core-path.txt).Trim()
          python scripts/test-idle-cpu.py --binary target/release/wayx.exe --core $core --geometry --gpu-cycles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage and exercise relocated core runtime
        timeout-minutes: 5
        env:
          WAYX_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        shell: pwsh
        run: |
          $env:PATH = "$env:WAYX_MSYS2_ROOT/ucrt64/bin;" + $env:PATH
          $core = (Get-Content build/xlibre/wayx-core-path.txt).Trim()
          python scripts/bundle-core.py --core $core --client target/release/wayx.exe --compiler build/windows-native/bin/xkbcomp.exe --xkb-dir build/windows-native/share/xkeyboard-config-2 --search-dir build/windows-installed/x64-windows/bin --search-dir $env:WAYX_MSYS2_ROOT/ucrt64/bin --license-dir build/xlibre-source --license-dir build/windows-installed/x64-windows/share --license-dir build/native-sources --output build/core-runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item build/core-runtime 'build/relocated runtime'
          Move-Item build/windows-installed build/windows-installed-disabled
          Move-Item build/windows-native build/windows-native-disabled
          & './build/relocated runtime/wayx.cmd' --frames 3 -- :196 -screen 0 640x480x24 -crtcs 1@640x480 -listen tcp -ac
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-core-runtime-${{ github.sha }}
          path: build/relocated runtime
          if-no-files-found: error
          retention-days: 7
