name: WayX packages
'on':
  push: null
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
jobs:
  build-linux:
    name: Build linux
    uses: ./.github/workflows/build-packages.yml
    with:
      platform: linux
  test-linux:
    name: Test linux
    needs: build-linux
    uses: ./.github/workflows/test-packages.yml
    with:
      platform: linux
      source-sha: ${{ github.sha }}
      runtime-artifact: ${{ needs.build-linux.outputs.runtime-artifact }}
      test-artifact: ${{ needs.build-linux.outputs.test-artifact }}
  build-windows:
    name: Build windows
    uses: ./.github/workflows/build-packages.yml
    with:
      platform: windows
  test-windows:
    name: Test windows
    needs: build-windows
    uses: ./.github/workflows/test-packages.yml
    with:
      platform: windows
      source-sha: ${{ github.sha }}
      runtime-artifact: ${{ needs.build-windows.outputs.runtime-artifact }}
      test-artifact: ${{ needs.build-windows.outputs.test-artifact }}
  build-macos:
    name: Build macos
    uses: ./.github/workflows/build-packages.yml
    with:
      platform: macos
  test-macos:
    name: Test macos
    needs: build-macos
    uses: ./.github/workflows/test-packages.yml
    with:
      platform: macos
      source-sha: ${{ github.sha }}
      runtime-artifact: ${{ needs.build-macos.outputs.runtime-artifact }}
      test-artifact: ${{ needs.build-macos.outputs.test-artifact }}
