[package]
name = "wayx"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "XLibre display backend using Rust, winit and wgpu"

[lib]
crate-type = ["rlib", "staticlib"]

[features]
default = ["desktop", "ssh"]
desktop = ["dep:winit", "dep:wgpu", "dep:pollster", "dep:arboard", "dep:x11rb", "dep:xim", "dep:cosmic-text", "dep:polling", "dep:windows-sys"]
ssh = ["dep:russh", "dep:tokio", "dep:rand", "dep:rpassword"]

[dependencies]
polling = { version = "3", optional = true }
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
libloading = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
winit = { version = "0.30", optional = true }
wgpu = { version = "0.20", optional = true }
pollster = { version = "0.3", optional = true }
arboard = { version = "3", default-features = false, features = ["wayland-data-control"], optional = true }
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time"], optional = true }
rand = { version = "0.8", optional = true }
rpassword = { version = "7", optional = true }
xim = { version = "0.5", features = ["x11rb-server"], optional = true }
cosmic-text = { version = "0.14", default-features = false, features = ["std", "swash"], optional = true }

x11rb = { version = "0.13", features = ["xfixes", "randr"], optional = true }

[dev-dependencies]
x11rb = { version = "0.13", features = ["xfixes", "xinput", "glx", "randr"] }
rand_10 = { package = "rand", version = "0.10" }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", optional = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
